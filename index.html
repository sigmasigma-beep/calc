<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1b1b2e, #0a0a12);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }

    .calculator {
      background: linear-gradient(145deg, #141427, #0d0d16);
      padding: 20px;
      border-radius: 18px;
      width: 320px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      border: 1px solid #23233a;
    }

    .display {
      width: 100%;
      height: 60px;
      background: linear-gradient(180deg, #000, #050505);
      color: #39ff14;
      font-size: 2rem;
      text-align: right;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 10px;
      margin-bottom: 15px;
      overflow-x: auto;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      font-size: 1.2rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(180deg, #2e2e3a, #1c1c26);
      color: #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.6);
    }

    button:active { transform: translateY(1px); }

    .operator { background: linear-gradient(180deg, #ffb347, #ff9500); color: #000; }
    .equals { background: linear-gradient(180deg, #5cff9d, #34c759); color: #000; grid-column: span 2; }
    .clear { background: linear-gradient(180deg, #ff6b6b, #ff3b30); color: #000; }

    /* ===== SECRET VAULT ===== */
    .viewer-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.9), rgba(0,0,0,0.98));
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      backdrop-filter: blur(8px);
    }

    .viewer {
      width: 92vw;
      height: 92vh;
      background: #0b0b12;
      border-radius: 20px;
      display: grid;
      grid-template-columns: 260px 1fr;
      box-shadow: 0 40px 120px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    .viewer-sidebar {
      background: linear-gradient(180deg, #111120, #0a0a14);
      padding: 14px;
      overflow-y: auto;
      border-right: 1px solid #1f1f2e;
    }

    .viewer-sidebar::before {
      content: "IMAGE VAULT";
      display: block;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #39ff14;
      margin-bottom: 12px;
      opacity: 0.7;
    }

    .vault-controls {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(10, 10, 20, 0.7);
      border: 1px solid #1f1f2e;
    }

    .vault-controls label {
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: #9bff79;
      text-transform: uppercase;
    }

    .vault-controls input[type="range"] {
      width: 100%;
      accent-color: #63ff8d;
    }

    .vault-controls button {
      height: 42px;
      font-size: 0.85rem;
      border-radius: 10px;
      background: linear-gradient(180deg, #32324a, #1b1b2a);
    }

    .vault-controls button.active {
      background: linear-gradient(180deg, #5cff9d, #34c759);
      color: #000;
    }

    .panic {
      background: linear-gradient(180deg, #ff8a80, #ff3b30) !important;
      color: #120000 !important;
      font-weight: 700;
    }

    .tempo-readout {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }

    .viewer-status {
      font-size: 0.75rem;
      color: #8fffb0;
      opacity: 0.8;
      min-height: 1em;
      letter-spacing: 0.4px;
    }

    .thumb {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.2s, transform 0.2s;
    }

    .thumb:hover {
      opacity: 1;
      transform: scale(1.02);
    }

    .viewer-main {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #050509, #000);
    }

    .viewer-main img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 16px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.8);
      transform-origin: center;
      transition: transform 0.1s ease-out;
    }

    .vault-hint {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 0.75rem;
      opacity: 0.3;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div class="calculator">
  <div id="display" class="display">0</div>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()" id="vaultBtn">C</button>
    <button onclick="deleteLast()">⌫</button>
    <button onclick="append('.')">.</button>
    <button class="operator" onclick="append('/')">÷</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="operator" onclick="append('*')">×</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="operator" onclick="append('-')">−</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="operator" onclick="append('+')">+</button>

    <button onclick="append('0')">0</button>
    <button class="equals" onclick="calculate()">=</button>
  </div>
</div>

<div id="viewerOverlay" class="viewer-overlay">
  <div class="viewer">
    <div class="viewer-sidebar">
      <div class="vault-controls">
        <label for="zoomRange">Zoom</label>
        <div class="tempo-readout"><span>1x</span><strong id="zoomValue">1.00x</strong><span>3x</span></div>
        <input id="zoomRange" type="range" min="1" max="3" step="0.05" value="1" />
        <label for="tempoRange">Metronome speed</label>
        <div class="tempo-readout"><span>60 BPM</span><strong id="tempoValue">90 BPM</strong><span>240 BPM</span></div>
        <input id="tempoRange" type="range" min="60" max="240" step="5" value="90" />
        <button id="metronomeBtn" type="button">Start metronome</button>
        <button id="panicBtn" class="panic" type="button">Panic (E)</button>
        <div id="metronomeStatus" class="viewer-status">Metronome is off.</div>
      </div>
      <div id="thumbs"></div>
    </div>
    <div class="viewer-main">
      <img id="mainImage" ondblclick="toggleFullscreen()" />
      <div class="vault-hint">Double‑click image = fullscreen • Press E = panic • Right‑click C = add images</div>
    </div>
  </div>
</div>

<input id="fileInput" type="file" accept="image/*" multiple hidden />

<script>
const display = document.getElementById('display');
const vaultBtn = document.getElementById('vaultBtn');
const fileInput = document.getElementById('fileInput');
const zoomRange = document.getElementById('zoomRange');
const tempoRange = document.getElementById('tempoRange');
const metronomeBtn = document.getElementById('metronomeBtn');
const panicBtn = document.getElementById('panicBtn');
const metronomeStatus = document.getElementById('metronomeStatus');
const tempoValue = document.getElementById('tempoValue');
const zoomValue = document.getElementById('zoomValue');
const mainImage = document.getElementById('mainImage');

const secretCombo = ['9','1','1','=','2','0','0','1'];
let inputBuffer = [];

function recordInput(v) {
  inputBuffer.push(v);
  if(inputBuffer.length > secretCombo.length) inputBuffer.shift();
  if(secretCombo.every((val,i)=>inputBuffer[i]===val)){
    toggleViewer(true);
    inputBuffer=[];
  }
}

function append(value){
  recordInput(value);
  if(display.textContent==='0') display.textContent=value;
  else display.textContent+=value;
}

function clearDisplay(){
  recordInput('C');
  display.textContent='0';
}

function deleteLast(){
  recordInput('⌫');
  display.textContent=display.textContent.length>1?display.textContent.slice(0,-1):'0';
}

function calculate(){
  recordInput('=');
  try{
    if(/[^0-9.)]$/.test(display.textContent)) return;
    display.textContent = Function('"use strict";return('+display.textContent+')')();
  }catch{}
}

/* ===== IMAGE STORAGE ===== */
let db;
let images=[];
let currentIndex=-1;
const req=indexedDB.open('secret-image-db',1);
req.onupgradeneeded=e=>{e.target.result.createObjectStore('images',{keyPath:'id',autoIncrement:true});};
req.onsuccess=e=>{db=e.target.result; loadImages();};

function loadImages(){
  images=[];
  const tx=db.transaction('images','readonly');
  tx.objectStore('images').openCursor().onsuccess=e=>{
    const c=e.target.result;
    if(c){images.push(c.value);c.continue();}
    else renderThumbs();
  };
}

function renderThumbs(){
  const thumbs=document.getElementById('thumbs');
  thumbs.innerHTML='';
  images.forEach((img,i)=>{
    const t=document.createElement('img');
    t.src=img.data;
    t.className='thumb';
    t.onclick=()=>showImage(i);
    thumbs.appendChild(t);
  });
  if(images.length && currentIndex===-1) showImage(0);
}

function showImage(i){
  currentIndex=i;
  mainImage.src=images[i].data;
  applyZoom();
}

function toggleViewer(state){
  document.getElementById('viewerOverlay').style.display=state?'flex':'none';
  if(!state) stopMetronome();
}

/* ===== FULLSCREEN ===== */
function toggleFullscreen(){
  if(!document.fullscreenElement) mainImage.requestFullscreen();
  else document.exitFullscreen();
}

/* ===== ZOOM CONTROL ===== */
function applyZoom() {
  const zoom = Number(zoomRange.value);
  mainImage.style.transform = `scale(${zoom})`;
  zoomValue.textContent = `${zoom.toFixed(2)}x`;
}

zoomRange.addEventListener('input', applyZoom);
applyZoom();

/* ===== METRONOME ===== */
let audioContext;
let metronomeTimer;
let metronomeBpm = Number(tempoRange.value);
let metronomeActive = false;

function updateTempoLabel() {
  tempoValue.textContent = `${tempoRange.value} BPM`;
}

function playBeep() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.type = 'sine';
  osc.frequency.value = 880;
  gain.gain.value = 0.08;
  osc.connect(gain).connect(audioContext.destination);
  osc.start();
  osc.stop(audioContext.currentTime + 0.08);
}

function scheduleNextBeep() {
  if (!metronomeActive) return;
  playBeep();
  metronomeStatus.textContent = `Ticking at ${metronomeBpm} BPM`;
  metronomeBpm = Math.min(metronomeBpm + 5, 240);
  tempoRange.value = String(Math.min(Number(tempoRange.value) + 5, 240));
  updateTempoLabel();
  const intervalMs = 60000 / metronomeBpm;
  metronomeTimer = setTimeout(scheduleNextBeep, intervalMs);
}

async function startMetronome() {
  if (metronomeActive) return;
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  await audioContext.resume();
  metronomeActive = true;
  metronomeBtn.classList.add('active');
  metronomeBtn.textContent = 'Stop metronome';
  metronomeBpm = Number(tempoRange.value);
  metronomeStatus.textContent = `Starting at ${metronomeBpm} BPM`;
  scheduleNextBeep();
}

function stopMetronome() {
  metronomeActive = false;
  metronomeBtn.classList.remove('active');
  metronomeBtn.textContent = 'Start metronome';
  clearTimeout(metronomeTimer);
  metronomeStatus.textContent = 'Metronome is off.';
}

metronomeBtn.addEventListener('click', () => {
  if (metronomeActive) stopMetronome();
  else startMetronome().catch(() => {
    metronomeStatus.textContent = 'Audio blocked: interact with page and try again.';
  });
});

tempoRange.addEventListener('input', () => {
  metronomeBpm = Number(tempoRange.value);
  updateTempoLabel();
});

updateTempoLabel();

/* ===== ADD IMAGES VIA BUTTON ===== */
vaultBtn.addEventListener('contextmenu',e=>{
  e.preventDefault();
  fileInput.click();
});
fileInput.addEventListener('change',e=>{
  [...e.target.files].forEach(file=>{
    const r=new FileReader();
    r.onload=()=>{
      const tx=db.transaction('images','readwrite');
      tx.objectStore('images').add({data:r.result});
      tx.oncomplete=loadImages;
    };
    r.readAsDataURL(file);
  });
  e.target.value='';
});

/* ===== PANIC BUTTON ===== */
function panicClose() {
    document.getElementById('viewerOverlay').style.display='none';
    stopMetronome();
    display.textContent='0';
}

panicBtn.addEventListener('click', panicClose);

window.addEventListener('keydown',e=>{
  if(e.key.toLowerCase()==='e' || e.key === 'Escape'){
    panicClose();
  }
});
</script>
</body>
</html>
